# CI：每次分支 push 和 PR 都必须通过 lint + 编译 + 测试
#
# tag 不触发 CI：一次发布是「先推分支（跑 CI）→ 再打 tag（只跑 Release）」，
# Release 的 verify 作业会反查同一个 SHA 的 CI 结果，tag 再跑一遍纯属浪费。
#
# 数据策略：线上永远用最新主数据，所以这里每次现拉，不做版本锁定。
name: CI

on:
  push:
    # 只关心分支；tag 推送交给 release.yml（它反查同一 SHA 的 CI 结果）
    branches: ['**']
  pull_request:

# 同一分支上的旧运行被新提交取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本由 package.json 的 packageManager 字段决定（12.15.0）
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # 清单由 src/ 推导，先算清单再拉数据：清单不完整就不可能开始下载
      # 这一步只读源码，不依赖 node_modules，所以放在 install 之前，出错最快失败
      - name: List master data tables
        id: tables
        run: echo "list=$(node script/master-db-files.cjs)" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      # lint 和 build 不依赖主数据，放在拉数据之前，出错时能更快失败
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Fetch latest master data
        run: |
          set -euo pipefail
          mkdir -p sekai-master-db-diff
          tables="${{ steps.tables.outputs.list }}"
          echo "拉取 $(echo "$tables" | wc -w) 张主数据表"
          for f in $tables; do
            curl -fsSL "https://raw.githubusercontent.com/Sekai-World/sekai-master-db-diff/main/$f.json" \
              -o "sekai-master-db-diff/$f.json"
          done

      - name: Fetch latest music metas
        run: curl -fsSL https://storage.sekai.best/sekai-best-assets/music_metas.json -o music_metas.json

      - name: Generate mock user data
        run: node script/gen-mock-user-data.cjs

      - name: Test
        run: pnpm exec jest --coverage=false --runInBand
