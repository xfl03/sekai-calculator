# 发布：打 tag 后只做「校验 CI 结果 → 编译 → 发布」，不重复跑测试。
#
# 认证用的是 npm Trusted Publishing（OIDC），仓库里不存任何 npm token：
#   · npm 靠 id-token: write 换一张只对本次运行有效的短票
#   · 前提：npmjs.com 上该包的 Trusted Publisher 填的是本仓库 + release.yml
#     （文件名要一字不差）+ environment 名（和下面 publish 作业里的 environment 对应）
#   · 所以这里绝不能设 registry-url 或 NODE_AUTH_TOKEN —— 静态凭据会抢先并被优先使用，
#     结果是 OIDC 换票走不到，报 ENEEDAUTH
#
# 为什么不直接用 workflow_run 依赖 CI 工作流：workflow_run 对 tag push 不触发
# （只对分支 push 触发），所以这里改成在 tag push 时反查同一个 commit 的 CI 结果，
# 等它跑完并要求结论为 success，否则整条发布链直接失败。
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm Trusted Publishing（OIDC）换票用，别删

jobs:
  verify:
    name: CI must be green for this commit
    if: github.repository == 'xfl03/sekai-calculator'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --limit 1 \
              --json status,conclusion 2>/dev/null || echo '[]')
            status=$(echo "$run" | jq -r '.[0].status // "none"')
            conclusion=$(echo "$run" | jq -r '.[0].conclusion // "none"')
            echo "attempt $i: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for $SHA"
                exit 0
              fi
              echo "::error::CI for $SHA finished with '$conclusion', refusing to publish"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for CI of $SHA (did you push the commit to a branch first?)"
          exit 1

  publish:
    name: Build and publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # 这个环境名必须和 npmjs.com 上 Trusted Publisher 配置里填的名字一致（没填就得删掉这行）
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # 刻意不设 registry-url、不设 cache：
          #   registry-url 会往 .npmrc 写一行 _authToken=${NODE_AUTH_TOKEN}，
          #   而 npm 会优先用这行静态凭据，把 OIDC 换票流程盖掉；
          #   发布作业不缓存依赖，避免缓存投毒（npm 官方示例也这么建议）。
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Trusted Publishing 需要 npm >= 11.5.1，runner 自带的版本不保证够新
      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@^11.15.0
          echo "npm $(npm --version)"

      # tag 和 package.json 版本必须一致，否则发出去的版本号会和 tag 对不上
      - name: Check version matches tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          echo "tag=$tag_version package.json=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Build
        run: pnpm build

      # Trusted Publishing（OIDC）：不注入任何 token，npm 自己在 id-token: write 下换票
      - name: Publish
        run: npm publish --provenance --access public
